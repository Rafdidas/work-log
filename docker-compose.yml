services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: worklog
      POSTGRES_USER: worklog
      POSTGRES_PASSWORD: worklog
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklog -d worklog"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      TZ: Asia/Seoul
      DB_URL: jdbc:postgresql://postgres:5432/worklog
      DB_USER: worklog
      DB_PASSWORD: worklog
      # 비워 두면 실행할 때마다 무작위 키를 만들어요(재시작하면 로그인이 풀림). 유지하려면 32바이트 이상으로 지정하세요.
      JWT_SECRET: ${JWT_SECRET:-}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
